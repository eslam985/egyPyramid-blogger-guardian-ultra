name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  # يسمح لك بتشغيل السكريبت يدوياً من واجهة جيت هاب للتجربة
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://Eslam315:$HF_TOKEN@huggingface.co/spaces/Eslam315/egyPyramid-guardian-ultra main
